schema: 2-0-6
dependencies:
  core: v5.0.0
on_start:
  load:
  - hardware: hardware
  - component: signal_point_attractor
  - component: realsense_camera
  - component: robot_kamera_charuco_erkennung
  - component: realsense_camera_2
  - component: statische_basiskamera_charuco_erkennung
  - component: basiskamera_kalibrierungen_kombinieren
components:
  signal_point_attractor:
    component: aica_core_components::motion::SignalPointAttractor
    display_name: Signal Point Attractor
    events:
      transitions:
        on_load:
          lifecycle:
            component: signal_point_attractor
            transition: configure
        on_configure:
          lifecycle:
            component: signal_point_attractor
            transition: activate
    parameters:
      angular_gains:
        value:
        - 2
        type: vector
      max_linear_velocity:
        value: 0.1
        type: double
      max_angular_velocity:
        value: 0.3
        type: double
      linear_precision:
        value: 0.005
        type: double
      angular_precision:
        value: 0.03
        type: double
    inputs:
      state: /hardware/robot_state_broadcaster/cartesian_state
      attractor: /auto_calibration/target_pose
    outputs:
      twist: /signal_point_attractor/twist
  realsense_camera:
    component: realsense2_camera::RealSenseNodeFactory
    display_name: Camera Robot
    parameters:
      camera_name:
        value: Robot_D435i
        type: string
      serial_no:
        value: '241122074842'
        type: string
      rgb_camera.profile:
        value: 848x480x30
        type: string
      depth_module.profile:
        value: 848x480x30
        type: string
      align_depth.enable:
        value: true
        type: bool
    outputs:
      color_image_raw: /realsense_camera/color_image_raw
      color_camera_info: /realsense_camera/color_camera_info
      aligned_depth_to_color_image_raw: /realsense_camera/aligned_depth_to_color_image_raw
  realsense_camera_2:
    component: realsense2_camera::RealSenseNodeFactory
    display_name: Camera Base
    parameters:
      camera_name:
        value: base_L515
        type: string
      serial_no:
        value: f1370107
        type: string
      align_depth.enable:
        value: true
        type: bool
    outputs:
      color_image_raw: /realsense_camera_2/color_image_raw
      color_camera_info: /realsense_camera_2/color_camera_info
      aligned_depth_to_color_image_raw: /realsense_camera_2/aligned_depth_to_color_image_raw
  robot_kamera_charuco_erkennung:
    component: roboter_tetris::RobotCamBoardDetection
    display_name: Robot-Kamera ChArUco-Erkennung
    events:
      transitions:
        on_load:
          lifecycle:
            component: robot_kamera_charuco_erkennung
            transition: configure
        on_configure:
          lifecycle:
            component: robot_kamera_charuco_erkennung
            transition: activate
    inputs:
      robot_cam_color_image: /realsense_camera/color_image_raw
      robot_cam_color_camera_info: /realsense_camera/color_camera_info
      robot_cam_aligned_depth_image: /realsense_camera/aligned_depth_to_color_image_raw
    outputs:
      robot_cam_board_pose: /robot_kamera_charuco_erkennung/robot_cam_board_pose
      robot_cam_board_observation_id: /robot_kamera_charuco_erkennung/robot_cam_board_observation_id
      robot_cam_board_depth: /robot_kamera_charuco_erkennung/robot_cam_board_depth
      robot_cam_board_geometry: /robot_kamera_charuco_erkennung/robot_cam_board_geometry
  statische_basiskamera_charuco_erkennung:
    component: roboter_tetris::StaticBaseCamBoardDetection
    display_name: Statische Basiskamera ChArUco-Erkennung
    events:
      transitions:
        on_load:
          lifecycle:
            component: statische_basiskamera_charuco_erkennung
            transition: configure
        on_configure:
          lifecycle:
            component: statische_basiskamera_charuco_erkennung
            transition: activate
    inputs:
      static_base_cam_color_image: /realsense_camera_2/color_image_raw
      static_base_cam_color_camera_info: /realsense_camera_2/color_camera_info
      static_base_cam_aligned_depth_image: /realsense_camera_2/aligned_depth_to_color_image_raw
    outputs:
      static_base_cam_board_pose: /statische_basiskamera_charuco_erkennung/static_base_cam_board_pose
      static_base_cam_board_observation_id: /statische_basiskamera_charuco_erkennung/static_base_cam_board_observation_id
  robot_kamera_hand_auge_3_board_lagen:
    component: roboter_tetris::RobotCamHandEyeThreeBoardPositions
    display_name: Robot-Kamera Hand-Auge-Kalibrierung (3 Board-Lagen)
    events:
      transitions:
        on_load:
          lifecycle:
            component: robot_kamera_hand_auge_3_board_lagen
            transition: configure
        on_configure:
          lifecycle:
            component: robot_kamera_hand_auge_3_board_lagen
            transition: activate
    inputs:
      static_base_cam_board_pose: /statische_basiskamera_charuco_erkennung/static_base_cam_board_pose
      static_base_cam_board_observation_id: /statische_basiskamera_charuco_erkennung/static_base_cam_board_observation_id
      robot_cam_board_pose: /robot_kamera_charuco_erkennung/robot_cam_board_pose
      robot_cam_board_observation_id: /robot_kamera_charuco_erkennung/robot_cam_board_observation_id
      robot_cam_board_depth: /robot_kamera_charuco_erkennung/robot_cam_board_depth
      robot_cam_board_geometry: /robot_kamera_charuco_erkennung/robot_cam_board_geometry
      robot_flange_state: /hardware/robot_state_broadcaster/cartesian_state
    outputs:
      robot_cam_handeye_target_flange_pose: /auto_calibration/target_pose
      robot_cam_handeye_static_base_cam_pose: /robot_kamera_hand_auge_3_board_lagen/static_base_cam_pose
    parameters:
      board_position_count:
        value: 3
        type: int
      auto_approach_enabled:
        value: true
        type: bool
      auto_approach_clearance_mm:
        value: 100.0
        type: double
      calibration_ws_x_min:
        value: -0.9
        type: double
      calibration_ws_x_max:
        value: -0.5
        type: double
      calibration_ws_y_min:
        value: 0.5
        type: double
      calibration_ws_y_max:
        value: 0.76
        type: double
      calibration_ws_z_min:
        value: 0.31
        type: double
      calibration_ws_z_max:
        value: 0.57
        type: double
      base_cam_samples_per_board_position:
        value: 10
        type: int
      robot_cam_handeye_file_path:
        value: /data/robot_cam_handeye_3positions_calibration.json
        type: string
  frame_to_signal:
    component: aica_core_components::ros::TfToSignal
    display_name: Frame to Signal
    events:
      transitions:
        on_load:
          lifecycle:
            component: frame_to_signal
            transition: configure
        on_configure:
          lifecycle:
            component: frame_to_signal
            transition: activate
    parameters:
      frame:
        value: Kalibrierstart
        type: string
    outputs:
      pose: /auto_calibration/target_pose
  basiskamera_kalibrierungen_kombinieren:
    component: roboter_tetris::BaseCamCalibrationFusion
    display_name: Basiskamera-Kalibrierungen kombinieren
    events:
      transitions:
        on_load:
          lifecycle:
            component: basiskamera_kalibrierungen_kombinieren
            transition: configure
        on_configure:
          lifecycle:
            component: basiskamera_kalibrierungen_kombinieren
            transition: activate
    parameters:
      base_cam_file:
        value: Extrinsics/base_cam_extrinsics.json
        type: string
      robot_cam_file:
        value: /data/robot_cam_handeye_3positions_calibration.json
        type: string
      output_file:
        value: /data/base_cam_fused_extrinsics.json
        type: string
      robot_cam_weight_percent:
        value: 50.0
        type: double
hardware:
  hardware:
    display_name: Hardware Interface
    urdf: Universal Robots 10e
    rate: 500
    events:
      transitions:
        on_load:
          load:
          - controller: robot_state_broadcaster
            hardware: hardware
          - controller: ik_velocity_controller
            hardware: hardware
    parameters:
      robot_ip: 192.168.96.221
    controllers:
      robot_state_broadcaster:
        plugin: aica_core_controllers/RobotStateBroadcaster
        outputs:
          cartesian_state: /hardware/robot_state_broadcaster/cartesian_state
        events:
          transitions:
            on_load:
              switch_controllers:
                hardware: hardware
                activate: robot_state_broadcaster
        display_name: Robot State Broadcaster
      ik_velocity_controller:
        plugin: aica_core_controllers/velocity/IKVelocityController
        inputs:
          command: /signal_point_attractor/twist
        events:
          transitions:
            on_load:
              switch_controllers:
                hardware: hardware
                activate: ik_velocity_controller
