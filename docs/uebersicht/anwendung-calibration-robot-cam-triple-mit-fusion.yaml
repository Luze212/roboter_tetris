      frame_to_signal:
        x: -480
        y: 260
      basiskamera_kalibrierungen_kombinieren:
        x: 1180
        y: -1120
    hardware:
      hardware:
        x: 1200
        y: 0
  buttons:
    button:
      display_name: 3-Board-Komponente laden (vorher Frame-Steuerung aus)
      on_click:
        load:
          component: robot_kamera_hand_auge_3_board_lagen
    button_2:
      display_name: Start 3 Board-Lagen (Roboter bewegt sich)
      on_click:
        call_service:
          component: robot_kamera_hand_auge_3_board_lagen
          service: start_three_board_calibration
    button_3:
      display_name: Board umgesetzt – weiter (Roboter bewegt sich)
      on_click:
        call_service:
          component: robot_kamera_hand_auge_3_board_lagen
          service: continue_after_board_move
    button_4:
      display_name: 3-Board-Lauf stoppen
      on_click:
        unload:
          component: robot_kamera_hand_auge_3_board_lagen
    button_5:
      display_name: Startpose anfahren (Roboter bewegt sich)
      on_click:
        load:
          component: frame_to_signal
    button_6:
      display_name: Frame-Steuerung aus
      on_click:
        unload:
          component: frame_to_signal
    button_7:
      display_name: Kalibrierungen fusionieren (keine Bewegung)
      on_click:
        call_service:
          component: basiskamera_kalibrierungen_kombinieren
          service: write_fused_base_cam_calibration
